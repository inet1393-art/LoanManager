name: Build Android APK on: push: branches: - main - master pull_request: workflow_dispatch: jobs: build: runs-on: ubuntu-latest steps: # دریافت پروژه - name: Checkout uses: actions/checkout@v4 # نصب Java 17 - name: Set up JDK 17 uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' # نصب Android SDK - name: Set up Android SDK uses: android-actions/setup-android@v3 # نصب SDK مورد نیاز - name: Install Android SDK packages run: | yes | sdkmanager --licenses || true sdkmanager "platform-tools" sdkmanager "platforms;android-35" sdkmanager "build-tools;35.0.0" # نصب Gradle - name: Set up Gradle uses: gradle/actions/setup-gradle@v4 with: gradle-version: '8.9' # ساخت APK بدون gradlew - name: Build debug APK run: | gradle assembleDebug --stacktrace # ذخیره APK - name: Upload APK uses: actions/upload-artifact@v4 with: name: LoanManager-debug-apk path: app/build/outputs/apk/debug/app-debug.apk if-no-files-found: error
